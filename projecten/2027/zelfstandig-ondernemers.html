<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Concurrentievergelijking &mdash; Zelfstandig Ondernemers</title>
<meta name="description" content="Interne vergelijking van aanbieders, opgesteld voor Zelfstandig Ondernemers.">
<link rel="icon" href="https://fliimedia.github.io/Flii.nl/assets/img/d913cc3c069f.png" type="image/png">
<style>
  :root{--navy:#152A46;--teal:#1C7293;--orange:#F2882D;--line:#D8DFE6;
        --muted:#5B6B7C;--ink:#1D2733;--klap:#ED1C23;--rand:#E1E4E7;--tekst:#5A6068;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#F7F8FA;}
  body{font-family:Calibri,'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);}

  .zo-app{min-height:100vh;display:flex;flex-direction:column;
    padding:14px clamp(10px,2.4vw,30px) 26px;}
  .zo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    max-width:1720px;width:100%;margin:0 auto 12px;}
  .zo-logo{height:22px;flex:none;}
  .zo-tabs{display:flex;gap:5px;margin-left:auto;margin-right:auto;flex-wrap:wrap;}
  .zo-tab{border:1px solid var(--rand);background:transparent;color:var(--tekst);
    border-radius:5px;padding:6px 13px;font:inherit;font-size:12px;font-weight:700;
    cursor:pointer;white-space:nowrap;line-height:1.4;transition:background .14s,color .14s;}
  .zo-tab:hover{border-color:var(--klap);color:var(--klap);}
  .zo-tab.is-actief{background:var(--klap);border-color:var(--klap);color:#fff;}

  /* het vel gebruikt de volle breedte in plaats van een geschaald vlak */
  .zo-vel{width:100%;max-width:1720px;margin:0 auto;background:#fff;
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 34px rgba(20,20,20,.10);
    padding:clamp(18px,2.6vw,40px);}

  /* koppen schalen mee */
  .zo-vel h2{font-size:clamp(22px,2.6vw,38px) !important;}

  /* tabel: op smalle schermen horizontaal scrollen in plaats van persen */
  .zo-tabelwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .zo-tabel{min-width:820px;}
  .zo-tabelwrap::-webkit-scrollbar{height:7px;}
  .zo-tabelwrap::-webkit-scrollbar-thumb{background:#C7D2DC;border-radius:4px;}

  /* communicatiestijl: drie kolommen, gestapeld op mobiel */
  .zo-taalkop,.zo-taalrij{display:flex;gap:12px;margin-bottom:10px;align-items:stretch;}
  .zo-thema{flex:0 0 96px;display:flex;align-items:center;font-size:11px;font-weight:700;
    color:var(--navy);text-transform:uppercase;letter-spacing:.06em;}

  /* platformtechniek: kolommen naast elkaar, wrap op smal */
  .zo-techrij{display:flex;gap:16px;flex-wrap:wrap;}
  .zo-techrij > div{flex:1 1 300px;min-width:0;}

  @media (max-width:820px){
    .zo-taalkop{display:none;}
    .zo-taalrij{flex-direction:column;gap:8px;margin-bottom:18px;}
    .zo-thema{flex:none;font-size:12px;}
    .zo-taalrij > div:not(.zo-thema){min-height:auto !important;}
    .zo-vel{border-radius:10px;}
  }
  @media (max-width:520px){
    .zo-tabs{width:100%;}
    .zo-tab{flex:1 1 auto;text-align:center;padding:8px 6px;}
  }
  .laadt{display:flex;align-items:center;justify-content:center;min-height:60vh;
    font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div id="root"><div class="laadt">Vergelijking laden&hellip;</div></div>
<script src="https://fliimedia.github.io/Flii.nl/assets/vendor/react.min.js"></script>
<script src="https://fliimedia.github.io/Flii.nl/assets/vendor/react-dom.min.js"></script>
<script src="zo-vergelijking.js?v=2"></script>
</body>
</html>
