<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hero-effecten — vergelijking | Flii Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F0E0C; --dim:#C7C3BB; --mag:#E8294A; --page:#FDFCFA;
    --muted:#4A4840; --rule:#E8E6E1;
    --ff-disp:'Bricolage Grotesque',system-ui,sans-serif;
    --ff-body:'DM Sans',system-ui,sans-serif;
    --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ff-body);}

  .bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:14px 20px;background:rgba(253,252,250,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);}
  .bar h1{font-family:var(--ff-mono);font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;margin:0 12px 0 0;color:var(--muted);}
  .tab{font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:7px 14px;border-radius:100px;cursor:pointer;
    background:linear-gradient(135deg,rgba(0,0,0,.07),rgba(0,0,0,.02));
    color:var(--ink);border:1px solid rgba(0,0,0,.25);}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .replay{margin-left:auto;font-family:var(--ff-mono);font-size:11px;font-weight:700;
    padding:7px 16px;border-radius:100px;cursor:pointer;background:var(--ink);color:#fff;
    border:1.5px solid rgba(232,41,74,.7);}

  .stage{min-height:78vh;display:flex;flex-direction:column;justify-content:center;
    padding:40px 20px 56px;max-width:1080px;margin:0 auto;}

  .eyebrow{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:auto;
    font-size:13px;color:var(--muted);}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--mag);flex-shrink:0;}
  .rule{flex:1;height:1px;background:var(--rule);}

  .headline{display:flex;flex-direction:column;gap:0;position:relative;margin:auto 0;}
  .line{font-family:var(--ff-disp);font-size:clamp(56px,15vw,96px);font-weight:800;
    letter-spacing:-2.5px;line-height:.96;display:block;white-space:nowrap;user-select:none;
    position:relative;}
  .line span{display:inline-block;will-change:transform,opacity,color;}

  .tagline{align-self:flex-start;font-size:13px;color:var(--muted);margin-top:22px;}
  .eb-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink);
    opacity:.55;margin:0 7px;vertical-align:middle;}
  .chip{align-self:flex-start;font-family:var(--ff-mono);font-size:11px;font-weight:700;
    letter-spacing:.06em;margin-top:8px;}

  .note{max-width:1080px;margin:0 auto;padding:0 20px 60px;font-size:13px;color:var(--muted);
    line-height:1.6;}
  .note strong{color:var(--ink)}
  .note code{font-family:var(--ff-mono);font-size:12px;background:rgba(0,0,0,.05);
    padding:1px 5px;border-radius:4px;}

  /* ── variant A: current — spring drop ─────────────────────────────── */
  [data-fx="drop"] .line span{opacity:0;}

  /* ── variant B: spark sweep ───────────────────────────────────────── */
  [data-fx="spark"] .line span{color:var(--dim);
    transition:color .28s ease, text-shadow .5s ease;}
  [data-fx="spark"] .line span.lit{color:var(--ink);}
  [data-fx="spark"] .line span.flash{text-shadow:0 0 18px rgba(232,41,74,.85);}
  .spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;
    box-shadow:0 0 8px 3px rgba(232,41,74,.95),0 0 22px 10px rgba(232,41,74,.45);
    opacity:0;pointer-events:none;z-index:2;}

  /* ── variant C: variable-weight swell ─────────────────────────────── */
  [data-fx="weight"] .line{font-variation-settings:'wght' 400;opacity:0;
    filter:blur(2px);}

  @media (prefers-reduced-motion: reduce){
    .line span,.line{opacity:1 !important;filter:none !important;color:var(--ink) !important;
      transform:none !important;font-variation-settings:'wght' 800 !important;}
    .spark{display:none !important;}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Hero-effect</h1>
  <button class="tab on" data-v="drop">A · huidig (drop)</button>
  <button class="tab" data-v="spark">B · vonk</button>
  <button class="tab" data-v="weight">C · gewicht</button>
  <button class="replay" id="replay">Opnieuw afspelen</button>
</div>

<div class="stage" id="stage" data-fx="drop">
  <div class="eyebrow">
    <span class="dot"></span>
    <span>Resultaatgerichte marketing</span>
    <span class="rule"></span>
    <span>sinds 2021</span>
  </div>

  <div class="headline" id="headline">
    <span class="line" data-t="Let's"></span>
    <span class="line" data-t="ignite"></span>
    <span class="line" data-t="ambitions"></span>
    <span class="spark" id="spark"></span>
  </div>

  <div>
    <div class="tagline" id="tagline">Campagnes<span class="eb-dot"></span>Platformen<span class="eb-dot"></span>AI</div>
    <div class="chip" id="chip">@fliimedia</div>
  </div>
</div>

<p class="note" id="note"></p>

<script>
(function () {
  var stage = document.getElementById('stage');
  var headline = document.getElementById('headline');
  var spark = document.getElementById('spark');
  var tagline = document.getElementById('tagline');
  var chip = document.getElementById('chip');
  var note = document.getElementById('note');
  var lines = [].slice.call(headline.querySelectorAll('.line'));
  var timers = [];
  var raf = null;

  var NOTES = {
    drop: '<strong>A — huidig.</strong> Twintig letters vallen los in met een veercurve, daarna de chip, daarna de tagline. Volledige duur ongeveer <code>4000ms</code>. Elk element gebruikt hetzelfde gebaar, waardoor er geen hiërarchie ontstaat.',
    spark: '<strong>B — vonk.</strong> De titel staat er direct, maar gedempt. Eén vonk loopt over de regels en ontsteekt de letters die hij passeert. Volledige duur ongeveer <code>1100ms</code>. Eén doorlopend gebaar in plaats van twintig losse, en het sluit letterlijk aan op “ignite”.',
    weight: '<strong>C — gewicht.</strong> Gebruikt Bricolage Grotesque als variabel font: de regels zwellen aan van <code>wght 400</code> naar <code>800</code> terwijl de onscherpte wegtrekt. Volledige duur ongeveer <code>900ms</code>. Geen enkele layout-verschuiving, en zeldzaam in het wild.'
  };

  function splitLines() {
    lines.forEach(function (line) {
      var text = line.getAttribute('data-t');
      line.textContent = '';
      text.split('').forEach(function (ch) {
        var s = document.createElement('span');
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        line.appendChild(s);
      });
    });
  }
  splitLines();
  var letters = [].slice.call(headline.querySelectorAll('.line span'));

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    letters.forEach(function (s) {
      s.style.cssText = '';
      s.classList.remove('lit', 'flash');
    });
    lines.forEach(function (l) { l.style.cssText = ''; });
    spark.style.opacity = '0';
    [tagline, chip].forEach(function (e) { e.style.cssText = 'opacity:0'; });
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function tail() {                      // shared: supporting elements fade up
    [tagline, chip].forEach(function (el, i) {
      el.style.transform = 'translateY(6px)';
      later(function () {
        el.style.transition = 'opacity .5s ease, transform .6s cubic-bezier(.22,1,.36,1)';
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }, 420 + i * 130);
    });
  }

  /* A — the current spring drop, reproduced */
  function playDrop() {
    var profiles = [[400,.26,720],[260,.18,560],[560,.30,900],[180,.14,480],
                    [640,.34,980],[340,.22,640],[480,.28,820],[200,.15,500]];
    letters.forEach(function (s, i) {
      var p = profiles[i % profiles.length];
      s.style.transform = 'translateY(-' + p[0] + 'px)';
      s.style.opacity = '0';
      later(function () {
        s.style.transition = 'transform ' + p[2] + 'ms cubic-bezier(.34,' + (1.2 + p[1]) + ',.64,1), opacity 80ms ease';
        s.style.transform = 'translateY(0)';
        s.style.opacity = '1';
      }, 300 + i * 75);
    });
    var end = 300 + letters.length * 75;
    [tagline, chip].forEach(function (el, i) {
      later(function () {
        el.style.transition = 'opacity .5s ease';
        el.style.opacity = '1';
      }, end + 900 + i * 420);
    });
  }

  /* B — a spark sweeps the baseline and ignites what it passes */
  function playSpark() {
    letters.forEach(function (s) { s.style.opacity = '1'; });
    var hRect = headline.getBoundingClientRect();
    var seq = lines.map(function (line) {
      var r = line.getBoundingClientRect();
      return {
        top: r.top - hRect.top + r.height * 0.72,
        left: r.left - hRect.left,
        right: r.right - hRect.left,
        spans: [].slice.call(line.querySelectorAll('span')).map(function (s) {
          var b = s.getBoundingClientRect();
          return { el: s, mid: b.left - hRect.left + b.width / 2 };
        })
      };
    });

    var DUR = 330;                 // per line
    var idx = 0;
    spark.style.opacity = '1';

    function sweep() {
      if (idx >= seq.length) {
        spark.style.transition = 'opacity .3s ease';
        spark.style.opacity = '0';
        return;
      }
      var L = seq[idx];
      var t0 = null;
      function step(now) {
        if (t0 === null) t0 = now;
        var k = Math.min(1, (now - t0) / DUR);
        var e = 1 - Math.pow(1 - k, 2);
        var x = L.left + (L.right - L.left + 40) * e - 20;
        spark.style.transform = 'translate(' + x + 'px,' + L.top + 'px)';
        L.spans.forEach(function (o) {
          if (!o.el.classList.contains('lit') && o.mid <= x) {
            o.el.classList.add('lit', 'flash');
            setTimeout(function () { o.el.classList.remove('flash'); }, 260);
          }
        });
        if (k < 1) raf = requestAnimationFrame(step);
        else { idx++; later(sweep, 40); }
      }
      raf = requestAnimationFrame(step);
    }
    sweep();
    tail();
  }

  /* C — variable-weight swell */
  function playWeight() {
    letters.forEach(function (s) { s.style.opacity = '1'; });
    lines.forEach(function (line, i) {
      line.style.fontVariationSettings = "'wght' 400";
      line.style.opacity = '0';
      line.style.filter = 'blur(3px)';
      line.style.transform = 'translateY(4px)';
      later(function () {
        line.style.transition = 'font-variation-settings .62s cubic-bezier(.22,1,.36,1),' +
                                'opacity .4s ease, filter .5s ease, transform .62s cubic-bezier(.22,1,.36,1)';
        line.style.fontVariationSettings = "'wght' 800";
        line.style.opacity = '1';
        line.style.filter = 'blur(0)';
        line.style.transform = 'translateY(0)';
      }, 80 + i * 110);
    });
    tail();
  }

  var PLAY = { drop: playDrop, spark: playSpark, weight: playWeight };
  var current = 'drop';

  function run(v) {
    current = v;
    stage.setAttribute('data-fx', v);
    note.innerHTML = NOTES[v];
    reset();
    requestAnimationFrame(function () { PLAY[v](); });
  }

  [].slice.call(document.querySelectorAll('.tab')).forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      run(t.getAttribute('data-v'));
    });
  });
  document.getElementById('replay').addEventListener('click', function () { run(current); });

  run('drop');
})();
</script>
</body>
</html>
