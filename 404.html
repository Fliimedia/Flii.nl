<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="max-age=300, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina niet gevonden | Flii Media</title>
<meta name="description" content="Deze pagina bestaat niet (meer). Ga terug naar de homepage van Flii Media.">
<meta name="robots" content="noindex">
<script>
(function(){
  var loc = window.location;
  var path = loc.pathname;

  // Strip trailing slash
  var cleanedPath = path.replace(/\/$/, '');

  // Only redirect if path has no file extension
  if (cleanedPath.indexOf('.') === -1 && cleanedPath !== '') {
    var cleanPath = path + loc.search + loc.hash;
    sessionStorage.setItem('cleanPath', cleanPath);
    var target = cleanedPath + '.html' + loc.search + loc.hash;
    window.location.replace(target);
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('content').style.display = 'flex';
    });
  }
})();
</script>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('https://fliimedia.github.io/Flii.nl/assets/fonts/BricolageGrotesque.woff2') format('woff2-variations');
