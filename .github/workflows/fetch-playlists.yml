name: Fetch playlists

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/playlists.json'
      - 'tools/fetch_playlists.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_playlists.py
      - name: Commit playlist data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/playlists
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Fetch playlist data [skip ci]"
            git push
          fi
