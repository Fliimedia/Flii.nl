name: Fetch brand logos

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/logos.json'
      - 'tools/process_logos.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - run: python tools/process_logos.py
      - name: Commit processed logos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/logos
          if git diff --staged --quiet; then
            echo "No logo changes"
          else
            git commit -m "Fetch and process brand logos [skip ci]"
            git push
          fi
