name: Partner screenshots

on:
  workflow_dispatch:
  push:
    paths: ['tools/partners.json','tools/shoot_partners.py']

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet playwright pillow && python -m playwright install --with-deps chromium
      - run: python tools/shoot_partners.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/partners
          git diff --staged --quiet || (git commit -m "Partner screenshots [skip ci]" && git push)
