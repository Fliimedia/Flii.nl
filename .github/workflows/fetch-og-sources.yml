name: Fetch OG sources

on:
  workflow_dispatch:
  push:
    paths: ['tools/og-sources.json','tools/fetch_og_sources.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pillow
      - run: python tools/fetch_og_sources.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/og-src
          git diff --staged --quiet || (git commit -m "Fetch OG source images [skip ci]" && git push)
