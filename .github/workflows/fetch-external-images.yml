name: Fetch external images

on:
  workflow_dispatch:
  push:
    paths: ['tools/external-images.json','tools/fetch_external_images.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet pillow
      - run: python tools/fetch_external_images.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/media
          git diff --staged --quiet || (git commit -m "Self-host external images [skip ci]" && git push)
