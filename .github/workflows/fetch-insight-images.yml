name: Fetch insight images

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/insight-images.json'
      - 'tools/fetch_insight_images.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow pillow-avif-plugin
      - run: python -c "import pillow_avif" || true
      - run: python tools/fetch_insight_images.py
      - name: Commit images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/insight
          if git diff --staged --quiet; then
            echo "No image changes"
          else
            git commit -m "Fetch insight cover images [skip ci]"
            git push
          fi
